- id: stdlib-only
  claim: The adopter-facing Python CLI needs only Python 3.11 or newer and the
    standard library.
  tier: tested
  evidence: python3 -m unittest tests.test_pecia.TheCliIsStdlibOnly
  verified: '2026-09-28'
  kill: The test checks imports and the isolated one-file invocation.
  notes: One-file invocation passed in scratch adopter repos on Python 3.12. A
    direct Python 3.14.7 import and ledger check also passed after escaping a
    lone surrogate in a source docstring. Public CI smoke jobs for 3.11, 3.13,
    and 3.14 passed at cd805609d09e5c5f424424e014c222c2b7a2c409; these are
    import/check probes, not the full behavioral suite.
- id: format-spec
  claim: The v2 format is documented and implemented; a clean composed-scope
    off-lineage review of a frozen public release remains open.
  tier: asserted
  evidence: spec/format-v2-consolidated.md
  verified: '2026-09-26'
  kill: A passing test suite is not a validation verdict for the complete
    spec.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: formal-model
  claim: A bounded Alloy model and seeded traps are included; its result is
    scoped to the model and run.
  tier: asserted
  evidence: dev/alloy-gate.sh
  verified: '2026-09-26'
  kill: The public release has not yet rerun the formal gate.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: dogfood
  claim: pecia was adopted for work in one sibling repository; two further
    exercises were one-shot imports, and pecia also tracks its own
    development.
  tier: asserted
  evidence: none
  verified: '2026-09-26'
  kill: The full observations remain in the separate development archive; this
    public tree does not independently re-run them.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: self-hosting
  claim: The public repository uses pecia to track its own forward-looking
    work from its first public commit.
  tier: tested
  evidence: python3 pecia_cli.py check && python3 pecia_cli.py next
  verified: '2026-09-28'
  kill: 'A fresh clone initially reported D009: no local timeline. Publishing the
    chain to a temporary local bare remote and running sync hydrated the same six-entry
    head before doctor and check passed.'
  notes: Initial public candidate commit 223ec84 (2026-09-26) had a local
    first-clone test. The six-entry log was later published and read back on
    the public GitHub remote; an anonymous clone at
    cd805609d09e5c5f424424e014c222c2b7a2c409 ran sync, doctor, check, and
    next. This is not an outsider task trial.
