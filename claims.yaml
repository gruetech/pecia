schema_version: 1
audit: '2026-09-26'
claims:
- id: pecia-definition
  claim: A pecia is a transferable unit of intended work whose return can be
    judged independently.
  tier: asserted
  evidence: none
  verified: '2026-09-26'
  kill: A design definition, not an empirical finding.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: reference-implementation
  claim: The Python CLI passes the retained public behavioral suite on the
    2026-10-02 local candidate tree.
  tier: tested
  evidence: uv run --python 3.12 --script dev/test-runner.py -j 4
  verified: '2026-10-02'
  kill: The suite includes E-code violation cases and a null scramble arm.
  notes: 'The final local candidate ran 1,269 tests on Python 3.12, with 11 skips
    and an OK result. This is local tree evidence; exact-public-SHA CI is a separate
    run.'
- id: rust-parity
  claim: The release-profile Rust CLI passes the same retained public
    behavioral suite on the 2026-10-02 local candidate tree, with documented
    implementation-specific skips.
  tier: tested
  evidence: PECIA_TEST_CLI=target/release/pecia uv run --python 3.12 --script
    dev/test-runner.py -j 4
  verified: '2026-10-02'
  kill: Shared subprocess assertions exercise both CLIs; Rust internal tests
    cover separate implementation arms.
  notes: 'The final local candidate ran 1,269 shared tests against the release Rust
    CLI, with 101 skips and an OK result. cargo test --locked also passed. The skips
    include Python-only implementation arms; they are not Rust passes. Exact-public-SHA
    CI is a separate run.'
- id: v2-storage
  claim: The CLI uses a local append-only log, published through
    refs/pecia/log, with compare-and-swap checks and a generated reviewable
    projection. For the default store the projection is .pecia/work.jsonl;
    with PECIA_LOG_DIR pinned it sits beside its own log and nothing is
    written into the repository. A refused sync leaves the store data
    byte-identical but may leave an empty .lock behind.
  tier: tested
  evidence: python3 -m unittest tests.test_pecia.TimelineGates
    tests.test_pecia.TimelineWritePath
  verified: '2026-09-26'
  kill: The named tests include damaged-log, stale-snapshot, and
    divergent-head cases.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: deterministic-queries
  claim: Ready, blocked, and next results are computed from the ledger graph
    in a stable order.
  tier: tested
  evidence: python3 -m unittest tests.test_pecia.Determinism
    tests.test_pecia.QueriesAndAudit
  verified: '2026-09-26'
  kill: The tests permute input order and include invalid graph cases.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: write-gate
  claim: The checker refuses structural ledger violations and terminal records
    without required disposition.
  tier: tested
  evidence: python3 -m unittest tests.test_pecia.WriteGate
    tests.test_pecia.ECodeKillMatrix
  verified: '2026-09-26'
  kill: The E-code matrix supplies malformed inputs and a valid control.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: adopter-template
  claim: The adopter pre-commit template checks staged ledger content when
    installed in a clone.
  tier: tested
  evidence: python3 -m unittest tests.test_adopter_template
  verified: '2026-09-26'
  kill: Tests demonstrate bad staged input is rejected and valid input passes;
    doctor reports whether the hook is active locally.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: board-projection
  claim: Board is a read-only human view over ledger state.
  tier: tested
  evidence: python3 -m unittest tests.test_pecia.BoardProjection
  verified: '2026-09-26'
  kill: Tests exercise statuses, blocked work, and adversarial text.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
    release commit.
- id: mcp-server
  claim: The Rust CLI exposes its commands through a stdio MCP server.
  tier: tested
  evidence: cargo test --release -p pecia-mcp -p pecia
  verified: '2026-09-26'
  kill: Tests exercise protocol replies and output boundaries.
  notes: Public tree at the 2026-09-26 source candidate; reverify at the
